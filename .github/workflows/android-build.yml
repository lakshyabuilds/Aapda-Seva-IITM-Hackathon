name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1' # Required for this project's AGP version
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Create .env file for secrets
        # Creates .env file with secrets from GitHub Repository Secrets
        # If the secrets are not set in GitHub, it uses placeholder values so the build doesn't fail
        run: |
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY || 'PLACEHOLDER_KEY' }}" > .env

      - name: Decode Keystore
        # Restores the keystore required to sign the APK. 
        # Tries to use the file if present in the repo, or a GitHub secret if defined securely.
        run: |
          if [ ! -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            cat debug.keystore.base64 | base64 --decode > debug.keystore
          fi

      - name: Build Debug APK
        # We run the build with --no-daemon to ensure a clean build environment on the CI runner
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
